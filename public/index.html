<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="yRelay – der direkte Draht zu Ruwen. Nachrichten, Wichtiges und Notfälle, zugestellt über seinen KI-Agenten.">
  <title>yRelay</title>

  <!-- PWA & Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0e518d">
  
  <!-- iOS Support -->
  <link rel="apple-touch-icon" href="/img/logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="yRelay">

  <link rel="preload" href="/fonts/schild-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/schild-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/schild-condensed-bold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/css/style.css">

  <!-- Quill.js für Admin E-Mail Tool -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>
  <!-- App-Container -->
  <div id="app">
    <!-- Ladeanimation -->
    <div id="ladebildschirm" class="ladebildschirm">
      <span class="wegweiser wegweiser-gross wegweiser-blau">yRelay</span>
      <div class="lade-spinner"></div>
    </div>
  </div>

  <!-- Toast-Benachrichtigungen -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal-Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-box" class="modal-box">
      <div id="modal-inhalt"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/login.js"></script>
  <script src="/js/views/reset.js"></script>
  <script src="/js/views/einladung.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/schuldashboard.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/games.js"></script>
  <script src="/js/app.js"></script>

  <!-- Service Worker Registrierung -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.error('ServiceWorker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
