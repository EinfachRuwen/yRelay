<!DOCTYPE html>
<html lang="de">
<head>
  <script>try{var t=localStorage.getItem("yrelay_thema");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="yRelay - Sicheres Messaging-Portal für KI-Agenten. Sende Nachrichten und Notfallbenachrichtigungen direkt an deinen Agenten.">
  <title>yRelay</title>

  <!-- PWA & Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  
  <!-- iOS Support -->
  <link rel="apple-touch-icon" href="/img/logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="yRelay">

  <link rel="preload" href="/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">

  <!-- Quill.js für Admin E-Mail Tool -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>
  <!-- App-Container -->
  <div id="app">
    <!-- Ladeanimation -->
    <div id="ladebildschirm" class="ladebildschirm">
      <div class="lade-logo">yRelay</div>
      <div class="lade-spinner"></div>
    </div>
  </div>

  <!-- Toast-Benachrichtigungen -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal-Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-box" class="modal-box">
      <div id="modal-inhalt"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/login.js"></script>
  <script src="/js/views/reset.js"></script>
  <script src="/js/views/einladung.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/schuldashboard.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/games.js"></script>
  <script src="/js/app.js"></script>

  <!-- Service Worker Registrierung -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.error('ServiceWorker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
