<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="yRelay - Sicheres Messaging-Portal für den Poke KI-Assistenten. Sende Nachrichten und Notfallbenachrichtigungen direkt an Poke.">
  <title>yRelay</title>

  <!-- PWA & Web App Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080c14">
  
  <!-- iOS Support -->
  <link rel="apple-touch-icon" href="/img/logo.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="yRelay">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">

  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><text y='.9em' font-size='60' x='50%25' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>y</text></svg>">
</head>
<body>
  <!-- Hintergrund-Animation -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- App-Container -->
  <div id="app">
    <!-- Ladeanimation -->
    <div id="ladebildschirm" class="ladebildschirm">
      <div class="lade-logo">
        <span class="logo-y">y</span><span class="logo-relay">Relay</span>
      </div>
      <div class="lade-spinner"></div>
    </div>
  </div>

  <!-- Toast-Benachrichtigungen -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal-Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-box" class="modal-box">
      <div id="modal-inhalt"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/login.js"></script>
  <script src="/js/views/reset.js"></script>
  <script src="/js/views/einladung.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/schuldashboard.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/app.js"></script>

  <!-- Service Worker Registrierung -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.error('ServiceWorker Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
